<style>
:root{
  /* layout: one screen, top to bottom = what you hear (scope), what you play (6 chords), what you punch in, what you shape (faders) */
  --ink:#0e1020; --panel:#181b30; --rail:#262b4a; --text:#eef0ff; --mute:#8d92ba;
  --hot:#ffb347; --l1:#ff6b5e; --l2:#ffc24b; --l3:#5ee6b8; --l4:#6bb8ff; --l5:#a58bff; --l6:#7f8cff; --lead:#f4a6ff;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(130% 55% at 50% -12%,#20254a 0,var(--ink) 62%) var(--ink);color:var(--text);font-family:var(--mono);font-size:12px;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.app{height:100%;max-width:1040px;margin:0 auto;padding:8px 14px 10px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;flex:none}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1;background:linear-gradient(90deg,var(--hot),var(--lead));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{-webkit-text-fill-color:var(--mute)}
.logo{position:relative}.logo small.by{position:absolute;left:0;top:100%;margin:2px 0 0;font-size:8.5px;white-space:nowrap;letter-spacing:.04em}
.logo small{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--mute);margin-left:6px;letter-spacing:0}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--rail)}
.dots i.on{background:var(--hot)}
.chip{height:36px;padding:0 11px;border-radius:18px;background:linear-gradient(180deg,#1f2340,#181b30);border:1px solid var(--rail);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);font-weight:600;white-space:nowrap}
#tl.flash{animation:barfl .28s ease-out}@keyframes barfl{0%{box-shadow:0 0 0 2px var(--hot),0 0 14px rgba(255,179,71,.6)}100%{box-shadow:0 0 0 0 transparent}}
#lab span{opacity:.4;padding:0 2px}#lab span.cur{opacity:1;color:var(--hot);font-weight:700}#lab span.pend{opacity:1;animation:labblink .5s steps(2) infinite}@keyframes labblink{50%{opacity:.2}}
.ledg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.lc{position:relative;height:48px;border-radius:9px;background:var(--ink);border:1px solid var(--rail);display:grid;place-items:center;align-content:center;gap:0;padding:0;color:var(--mute)}
.lc.bar{border-left:3px solid #3a4070}.lc b{font-family:var(--display);font-size:16px;line-height:1}.lc small{font-size:8.5px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.lc i{position:absolute;left:4px;top:2px;font-style:normal;font-size:8px;opacity:.6}.lc.set{color:#fff;background:#232849}.lc.set b{color:var(--hot)}
.llay{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.lhint{grid-column:1/-1;font-size:11px;color:var(--mute)}
.llay button{height:30px;border-radius:8px;background:var(--ink);border:1px solid var(--rail);font-size:9px;font-weight:700;color:var(--mute);padding:0 2px;overflow:hidden}
.llay button.on{background:var(--l3);border-color:var(--l3);color:#10121f}.llay button.part{border-color:var(--l3);color:#fff}.llay button:disabled{opacity:.3}
.ltools{display:flex;gap:6px;flex-wrap:wrap}.ltools .chip{flex:1;height:36px;font-size:12px}.ltools .chip:disabled{opacity:.35}
.lc.brk::after{content:'✕';position:absolute;right:4px;top:2px;font-size:9px;color:var(--l1)}
.lc.sel{outline:2px solid var(--hot);outline-offset:1px}.lc.lnow{box-shadow:inset 0 -4px 0 var(--l3)}
.lpads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.lpads .chip{height:40px;padding:0 6px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}.lpads .chip:disabled{opacity:.35}
#tl{cursor:pointer}
#hook,#strum{position:relative}#strum::after{content:'';position:absolute;right:5px;top:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
.mixl{display:grid;gap:8px}.mx{display:grid;grid-template-columns:70px 1fr 34px;align-items:center;gap:10px;font-size:13px;font-weight:600}.mx output{text-align:right;color:var(--mute);font-size:12px}.mx input{width:100%}
.shsec{display:flex;gap:6px;flex:none}.shsec .chip{flex:1;height:34px}
.cyc button[hidden]{display:none}
.lmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lmenu .chip{height:auto;min-height:58px;display:grid;align-content:center;gap:3px;text-align:left;padding:8px 12px;white-space:normal;border-radius:14px}
.lmenu .chip small{font-size:10px;font-weight:500;color:var(--mute)}.lmenu .chip.on small{color:inherit;opacity:.8}.lmenu .chip:disabled{opacity:.35}.lmenu .danger{border-color:var(--l1)}.lmenu .danger.on{background:var(--l1);color:#fff}
#loop.odub{border-color:var(--l1);color:#fff}
#tip{position:fixed;z-index:9;background:#fff;color:#10121f;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.35;box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none}
.vibes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vibe{display:grid;gap:4px}.vibes button{display:grid;gap:3px;text-align:left;padding:10px 12px;border-radius:14px;background:var(--ink);border:1px solid var(--rail);min-height:64px}
.vibes em{font-style:normal;font-size:11px;font-weight:700;color:var(--hot);margin-top:2px}.vibes .vjs{min-height:30px;padding:0 12px;font-size:11px;color:var(--mute);border-radius:10px;place-content:center;text-align:center}
.vibes b{font-family:var(--display);font-size:17px;color:var(--hot)}.vibes small{font-size:11px;color:var(--mute);line-height:1.3}
.jrow{gap:5px}.jrow .chip{flex:1 1 0!important;min-width:0;height:36px!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px!important}
.prow[hidden]{display:none}.hvt{width:46px;flex:none;display:grid;gap:3px}.hvt button{border-radius:7px;font-size:8.5px;font-weight:700;letter-spacing:.06em;background:#171a30;border:1px solid #272c50;color:var(--mute);padding:0}
.hvt button[data-t="1"].on{background:var(--l4);border-color:var(--l4);color:#10121f}.hvt button[data-t="2"].on{background:var(--l2);border-color:var(--l2);color:#10121f}.hvt button.lit:not(.on){border-color:#fff;color:#fff}
#play::after,#lift::after,#hook::after{content:'';position:absolute;right:5px;top:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}#play,#lift,#hook{position:relative}
#lpads[hidden],#llay[hidden]{display:none}
.logo small{white-space:nowrap}
#pg-shape .cyc{flex:1 1 auto;grid-auto-rows:minmax(44px,1fr);max-height:340px}#pg-shape .cyc button{height:auto!important;min-height:44px}
#fadersS{flex:1 1 auto;align-content:space-evenly}
@media (max-width:420px){.prow .pb{font-size:9px;letter-spacing:-.02em;padding:0 1px}.prow{gap:4px}#punchJ .rl,.hvt{width:38px}.jrow .chip{font-size:11.5px;padding:0 6px}}
.chip.arm{background:var(--l1);border-color:var(--l1);color:#fff}
.chip.on{background:linear-gradient(180deg,#ffc469,#ffa83a);color:var(--ink);border-color:var(--hot);box-shadow:0 0 14px rgba(255,179,71,.35)}
#play{min-width:96px;height:42px;font-size:15px;font-weight:800;border-radius:21px;flex:none;letter-spacing:.02em}
#play.on{box-shadow:0 0 18px rgba(255,179,71,.5)}
#play.stop{background:linear-gradient(180deg,#2a2f55,#1d2140);border-color:#4a5190;color:var(--text)}
.scope{position:relative;flex:1.2 1 0;min-height:44px;max-height:170px;border-radius:16px;background:linear-gradient(180deg,#1c2040,#12142a);border:1px solid #232849;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.scope canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.now{position:absolute;left:14px;top:9px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1;text-shadow:0 1px 8px var(--ink)}
.next{position:absolute;right:12px;top:11px;color:var(--hot);font-weight:600;text-shadow:0 1px 8px var(--ink)}
.row{display:flex;gap:6px;align-items:center;flex:none}
.rl{width:46px;flex:none;color:var(--mute);font-size:9px;letter-spacing:.12em;font-weight:600}
.sets::-webkit-scrollbar{display:none}
.sets .chip{height:30px;flex:none}
.pads{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:6px;flex:3 1 0;min-height:84px}
.pad{position:relative;will-change:transform;border-radius:16px;background:linear-gradient(165deg,#20244a,#15182d 70%);border:1.5px solid #2a3058;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.25);display:flex;flex-direction:column;
  align-items:flex-start;justify-content:flex-end;padding:4px 9px;min-height:0;touch-action:none;transition:transform .06s}
.pad:active{transform:scale(.97)}
.pad b{font-family:var(--display);font-weight:800;font-size:clamp(15px,2.9vh,22px);line-height:1.05;text-align:left}
.pad span{position:absolute;top:4px;left:9px;color:var(--mute);font-size:10px}
.pad em{position:absolute;left:50%;transform:translateX(-50%);font-style:normal;font-size:8px;line-height:1;opacity:.28;pointer-events:none}
.pad em.up{top:3px}.pad em.dn{bottom:3px}
.pad.fup em.up,.pad.fdn em.dn{opacity:1;color:var(--l3);font-size:10px}
.pad.cur.fup em.up,.pad.cur.fdn em.dn{color:var(--ink)}
.pad.pvup em.up,.pad.pvdn em.dn{opacity:1;color:var(--hot);font-size:15px;text-shadow:0 0 8px rgba(255,179,71,.8)}
.pad.cur.pvup em.up,.pad.cur.pvdn em.dn{color:var(--ink);text-shadow:none}

.pads{position:relative}
.pad.land{animation:land .4s ease-out}@keyframes land{0%{box-shadow:0 0 0 4px #fff,0 0 40px rgba(255,255,255,.9)}100%{box-shadow:0 0 22px rgba(255,170,60,.38)}}
.pad.cur{background:linear-gradient(165deg,#ffcf7d,#ff9f2e);border-color:#ffc469;color:var(--ink);box-shadow:0 0 22px rgba(255,170,60,.38),inset 0 1px 0 rgba(255,255,255,.35)}
.pad.cur span{color:var(--ink)}
.pad.queued{border-color:var(--hot);border-style:dashed;background:linear-gradient(to top,rgba(255,179,71,.5) calc(var(--qf,0)*100%),rgba(255,179,71,.08) calc(var(--qf,0)*100%)),linear-gradient(165deg,#20244a,#15182d 70%)}
.pad.queued2{border-color:var(--hot);border-style:dotted;border-width:2px}.pad.queued2::before{content:'½';position:absolute;right:10px;top:6px;color:var(--hot);font-family:var(--display);font-size:15px}
@keyframes blink{50%{background:var(--rail)}}
.punch{display:flex;flex-direction:column;gap:5px;flex:none}
.pb{position:relative;border-radius:11px;background:linear-gradient(180deg,#1f2342,#171a30);border:1px solid #272c50;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:#c9cdf0;font-weight:600;font-size:9px;letter-spacing:0;line-height:1.1;
  min-height:34px;touch-action:none;padding:0 2px}
.prow{display:flex;gap:5px;align-items:stretch}.prow .pb{flex:1;min-width:0;height:44px;font-size:10.5px}
.rl{width:40px}
#tl{flex:1;min-width:0;height:30px;border-radius:10px;background:#141730;border:1px solid #232849;display:block}
.pb.on{background:var(--c);border-color:var(--c);color:var(--ink);box-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.pb.lp{background:color-mix(in srgb,var(--c) 14%,#171a30);border:2px solid var(--c);color:#fff}
.pb.hold{box-shadow:0 0 0 2px #fff,0 0 22px var(--c)}
.pb.lock::before{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:currentColor}
.bends{display:grid;grid-template-columns:1fr;gap:6px;flex:none}
#loct{height:30px;flex:none;padding:0 10px}
#lead{background-image:repeating-linear-gradient(90deg,rgba(141,146,186,.22) 0 1px,transparent 1px calc(100%/var(--n,12))),linear-gradient(180deg,#1b1f3a,#141730);color:#c9cdf0;cursor:ew-resize}
.cyc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none}
.cyc button{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:40px;font-size:10px!important;border-radius:12px;background:linear-gradient(180deg,#1f2342,#171a30);border:1px solid #272c50;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);font-size:10px;font-weight:600;letter-spacing:.02em;padding:0 6px}
.cyc button small{display:block;color:var(--mute);font-size:8px;font-weight:400;letter-spacing:.06em}
.bs{position:relative;height:52px;border-radius:12px;background:linear-gradient(180deg,#1b1f3a,#141730);border:1px solid #262b4e;overflow:hidden;touch-action:none;
  display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;cursor:ew-resize}
.bs::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--b,0)*100%);background:var(--c);opacity:.5}
.bs span{position:relative;font-size:10px;letter-spacing:.03em}.bs{border-bottom:3px solid var(--c)}
.faders{display:grid;gap:5px;flex:none}
.fd{display:grid;grid-template-columns:62px 1fr 74px;align-items:center;gap:8px;height:26px}
#fadersS{grid-template-columns:1fr 1fr;column-gap:16px;row-gap:3px}
#fadersS .fd{grid-template-columns:1fr auto;height:auto;gap:0 6px}
#fadersS .fd label,#fadersS .fd output{font-size:10px}#fadersS .fd output{grid-row:1;grid-column:2}
#fadersS .fd input{grid-column:1/-1;height:22px}
.xyrow{display:flex;gap:8px;align-items:stretch;flex:none;height:62px}
#xyp{flex:1;min-width:0;height:100%;border-radius:12px;background:#141730;border:1px solid #262b4e;touch-action:none;display:block;cursor:crosshair}
.xyrow .faders{width:44%;align-content:center}
.xyrow .fd{grid-template-columns:1fr;height:auto;gap:2px}.xyrow .fd output{text-align:left}
.fd label{font-weight:600;letter-spacing:.04em;font-size:11px}
.fd output{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--hot) var(--p,50%),var(--rail) var(--p,50%))}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--rail)}
input[type=range]::-moz-range-progress{height:10px;border-radius:5px;background:var(--hot)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--text);margin-top:-7px;border:0}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--text);border:0}
.sheet{position:fixed;inset:0;background:rgba(8,9,20,.72);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.sheet .box{background:var(--panel);width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 16px 24px;display:grid;gap:12px}
.sheet h2{font-family:var(--display);font-size:20px;margin:0;display:flex;justify-content:space-between;align-items:center}
.opt{display:grid;gap:5px}
.opt>label,.opt>div:first-child{color:var(--mute);font-size:11px;display:flex;justify-content:space-between}
.dg{display:grid;grid-template-columns:16px repeat(16,1fr);gap:3px;align-items:center}
.dg b{font-size:10px;color:var(--mute)}
.dgw .dg{gap:4px}.dgw .dg button{height:clamp(26px,5vh,44px)}
.dg button{height:30px;border-radius:5px;background:var(--ink);border:1px solid var(--rail)}
.dg button.q{border-color:var(--mute)}
.dg button.on{background:var(--hot);border-color:var(--hot)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
#pbox .seg button{min-height:44px;flex:1 1 30%}
.seg button{min-height:34px;padding:0 11px;border-radius:9px;background:var(--ink);border:1px solid var(--rail)}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ink);border:1px solid var(--rail)}
.slot b{font-family:var(--display);font-size:15px}.slot small{display:block;color:var(--mute);font-size:10.5px;margin-top:2px}
.slot .chip{height:36px}.slot.empty b{color:var(--mute)}
#tourhole{position:fixed;z-index:20;border:2px solid var(--hot);border-radius:16px;box-shadow:0 0 0 9999px rgba(8,9,20,.72);pointer-events:none;transition:all .25s}
#tourcard{position:fixed;max-height:calc(100% - 28px);overflow-y:auto;left:50%;transform:translateX(-50%);z-index:21;width:min(420px,calc(100% - 28px));background:var(--panel);border:1px solid var(--rail);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#tourcard h3{font-family:var(--display);font-size:19px;margin:0 0 6px}#tourcard p{margin:0;color:#c9cdf0;font-size:12px;line-height:1.5}
#tourcard .tnav{display:flex;align-items:center;gap:8px;margin-top:12px}#tourcard .tnav i{flex:1;color:var(--mute);font-style:normal;font-size:11px}
#tourcard .by{color:var(--mute);font-size:10px;margin-top:8px}
@media (prefers-reduced-motion:reduce){#tourhole{transition:none}}
.erows{display:grid;gap:6px}.erow{display:grid;grid-template-columns:22px 1fr 1.4fr 46px;gap:6px;align-items:center}.erow b{font-family:var(--display);color:var(--hot);text-align:center}
.sheet select{background:var(--ink);color:inherit;border:1px solid var(--rail);border-radius:10px;height:38px;padding:0 8px;font:inherit;min-width:0}
.setl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#pbox #pkey button{flex:1 1 13%;min-height:34px;padding:0}
.setl button{display:grid;gap:2px;text-align:left;padding:7px 12px;border-radius:12px;background:var(--ink);border:1px solid var(--rail)}
.setl button b{font-family:var(--display);font-size:15px}
.setl button small{color:var(--mute);font-size:9.5px;line-height:1.3;white-space:normal}
.setl button.on{border-color:var(--hot);box-shadow:0 0 12px rgba(255,179,71,.25)}
.setl button.on b{color:var(--hot)}
.seg button.on{background:var(--hot);border-color:var(--hot);color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;margin-left:auto}
.pages{flex:1;display:flex;gap:22px;min-height:0}
.pg{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.pg[hidden]{display:none}
#rec{color:#ff8a80;border-color:rgba(255,107,94,.55);background:linear-gradient(180deg,#2a1d2e,#1e1726)}
#rec::before{content:'';display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--l1);margin-right:6px;vertical-align:-1px;box-shadow:0 0 8px rgba(255,107,94,.6)}
#rec.on{background:var(--l1);border-color:var(--l1);color:#fff;animation:recp 1s ease-in-out infinite}
#rec.on::before{background:#fff}
@keyframes recp{50%{box-shadow:0 0 18px rgba(255,107,94,.8)}}
.pad.sug{border-color:var(--l3);box-shadow:0 0 12px rgba(94,230,184,.18),inset 0 1px 0 rgba(255,255,255,.06)}
.pad.sug::after{content:"try";position:absolute;top:4px;right:10px;font-size:10px;color:var(--l3)}

    $('#tskip').onclick=()=>{tour(99);document.querySelector('.tabs [data-pg="jam"]').click()};if($('#tnext'))$('#tnext').onclick=()=>tour(i+1);
    /* keep the card on screen: if it would stick out (for example when a whole page is highlighted), pin it to the bottom */
    const cr=card.getBoundingClientRect();if(cr.top<8||cr.bottom>innerHeight-8||r.height>innerHeight*.5){card.style.top='';card.style.bottom='14px'}})}
window.startTour=()=>{$('#sheet').classList.remove('open');tour(0)};
if(matchMedia('(min-width:900px)').matches)document.querySelector('.tabs [data-pg="shape"]').click();
const VIBES=[['Night drive','Dark minor chords, warm Juno, steady beat',{set:2,key:9,bpm:100,kit:'808',swing:.1},'juno',true],
  ['Lo-fi','Dusty tape, lazy swing, soft chords',{set:7,key:5,bpm:82,kit:'lofi',swing:.35},'lofi',true],
  ['Anthem','Big supersaw lines and an arp',{set:1,key:7,bpm:126,kit:'909',swing:0},'lines',true,['arp']],
  ['Neo-soul','Rich jazzy chords, brushes',{set:6,key:3,bpm:88,kit:'brush',swing:.25},'juno',true],
  ['Synthwave','Wide strings, open voicing, 80s drums',{set:9,key:9,bpm:108,kit:'808',swing:0},'strings',true],
  ['Floating','Glassy chords, no drums, lots of space',{set:0,key:0,bpm:84,space:.85},'glass',false,['spark']],
  ['Lounge keys','Rhodes chords, brushes, lazy swing',{set:6,key:5,bpm:86,kit:'brush',swing:.28},'lounge',true,['counter']],
  ['Deep dub','Dark offbeat stabs, long echoes, deep bass, 123 bpm',{set:SETS.length-1,key:1,bpm:123,kit:'classic',swing:.05},'deep',true,['stab','bass']]];
/* install as an app: Android/desktop Chrome offers a real install prompt; iPhone needs Share > Add to Home Screen */
let instEv=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;if($('#pick').classList.contains('open')&&$('#pbox .vibes'))quickStart()});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const iosHint=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)&&/github\.io$/.test(location.hostname);
const canInstall=()=>!standalone()&&(!!instEv||iosHint());
function doInstall(){if(instEv){instEv.prompt();instEv.userChoice.finally(()=>{instEv=null;$('#pick').classList.remove('open')})}
  else if(iosHint()){$('#pbox').innerHTML='<h2>Install Gliss<button class="chip" id="pclose">OK</button></h2><div class="opt"><div style="font-size:15px;line-height:1.5">1. Tap the <b>Share</b> button in Safari (the square with the arrow up).<br>2. Scroll down and tap <b>Add to Home Screen</b>.<br>3. Tap <b>Add</b>. Gliss then opens full screen from its own icon and works offline.</div></div>';$('#pick').classList.add('open');$('#pclose').addEventListener('click',()=>$('#pick').classList.remove('open'))}}
window.doInstall=doInstall;
function quickStart(){$('#pbox').innerHTML='<h2>Start a jam<button class="chip" id="pclose">Just play</button></h2>'+(canInstall()?'<button class="chip on" id="inst" style="height:48px;font-size:15px">⬇ Install Gliss as an app<small style="display:block;font-size:10px;font-weight:500;opacity:.8">Full screen, its own icon, works offline</small></button>':'')+'<div class="vibes">'+VIBES.map((v,i)=>`<button data-i="${i}"><b>${v[0]}</b><small>${v[1]}</small></button>`).join('')+'</div>';
  $('#pick').classList.add('open');$('#pclose').addEventListener('click',()=>$('#pick').classList.remove('open'));if($('#inst'))$('#inst').addEventListener('click',doInstall);
  $('#pbox .vibes').addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;const [n,,set,pre,beat,extra]=VIBES[+x.dataset.i];
    Object.assign(P,set);if(!ctx)init();P.preset=pre;applySnd(PRESETS[pre][1]);P.mxL=PLV[pre]??.5;if(PRESETS[pre][2])Object.assign(P,PRESETS[pre][2]);applyMotion();applyDetune();Object.keys(latched).forEach(k=>delete latched[k]);if(beat)latched.beat=true;(extra||[]).forEach(k=>latched[k]=true);
    applyMacros();momentsApply();UIR.forEach(f=>f());save();$('#pick').classList.remove('open');if(!playing){cur=0;start()}else{queued=0;qAt=-1;preStarted=false}paint();say(n+'. Tap the pads to play.')})}
window.quickStart=quickStart;
try{if(!localStorage.getItem('gliss-tour'))setTimeout(()=>tour(0),400);else setTimeout(quickStart,300)}catch(e){}
['pointerup','touchend','click'].forEach(ev=>addEventListener(ev,()=>{if(ctx&&ctx.state!=='running')ctx.resume()},true));
/* iPhone stops web audio in the background: fade out instead of a hard cut, and come back in smoothly */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
document.addEventListener('visibilitychange',()=>{if(!ctx||!playing)return;const t=ctx.currentTime;
  if(document.hidden){if(isIOS){hold(A.vol.gain,t);A.vol.gain.setTargetAtTime(0,t,.05)}}
  else{ctx.resume();if(!fading){hold(A.vol.gain,ctx.currentTime);A.vol.gain.setTargetAtTime(P.vol,ctx.currentTime,.15)}}});
</script>
